server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # add_header in a location replaces the ones of the server block, so every location
    # that sets its own header includes this file again.
    include /etc/nginx/conf.d/security-headers.inc;

    # Vite emits hashed asset filenames, so they can be cached aggressively.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/conf.d/security-headers.inc;
    }

    # Single-page application fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must always be revalidated so deployments pick up new assets.
    location = /index.html {
        add_header Cache-Control "no-store";
        include /etc/nginx/conf.d/security-headers.inc;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;
}
