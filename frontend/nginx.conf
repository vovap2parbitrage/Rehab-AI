server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite emits hashed asset filenames, so they can be cached aggressively.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page application fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must always be revalidated so deployments pick up new assets.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location = /silent-check-sso.html {
        add_header Cache-Control "no-store";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;
}
