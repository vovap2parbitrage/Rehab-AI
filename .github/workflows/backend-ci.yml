name: Backend CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rehab_ai
          POSTGRES_USER: rehab
          POSTGRES_PASSWORD: rehab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rehab -d rehab_ai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        env:
          SECRET_KEY: ci-only-secret-key-0123456789abcdefghij
        run: pytest -q
