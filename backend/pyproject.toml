[project]
name = "rehab-ai-backend"
version = "0.1.0"
description = "FastAPI backend skeleton for Rehab AI"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pydantic-settings>=2.5",
  "pydantic[email]>=2.8",
  "python-jose[cryptography]>=3.3",
  "pwdlib[argon2]>=0.2",
  "python-multipart>=0.0.9",
  "redis>=5.0",
  "celery[redis]>=5.4",
  "httpx>=0.27",
]
[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11"]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
  "integration: requires running external services (PostgreSQL); run with `pytest -m integration`",
]
